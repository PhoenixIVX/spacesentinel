name: Post Social Updates

on:
  schedule:
    - cron: '0 9 * * *'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install atproto

      - name: Post upcoming observable approaches to Bluesky
        env:
          DRY_RUN: '1'
          BLUESKY_HANDLE: ${{ secrets.BLUESKY_HANDLE }}
          BLUESKY_APP_PASSWORD: ${{ secrets.BLUESKY_APP_PASSWORD }}
        run: python scripts/post_social.py

      - name: Commit and push if posts were recorded
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/social-posted.json
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Record social posts ($(date -u +%Y-%m-%d))"
            for attempt in 1 2 3; do
              git pull --rebase origin main
              git push && break || {
                [ $attempt -eq 3 ] && echo "Push failed after 3 attempts" && exit 1
                sleep $((attempt * 10))
              }
            done
          fi
